# Arm C-mutual — Π-guidance BOTH WAYS: audio and vision each minimize
# d_CKA(Π_self, Π_other) against the other's pre-step (detached) state, on top
# of their own task CE. No fixed teacher; the pair co-adapts their dynamics.
# Compare with arm C (audio follows vision) and arm A (no coupling).
_base_: arm_c_pi_only.yaml
guidance:
  guided: [audio, vision]
wandb: {name: av-armC-pi-mutual}
train: {outdir: runs/av-armC-mutual}
